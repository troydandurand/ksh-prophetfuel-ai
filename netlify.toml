[build]
  publish = "."
  functions = "netlify/functions"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[functions]
  node_bundler = "esbuild"

# ============================================================
# STRIP .html FROM INCOMING URLs — force clean address bar
# pretty_urls only rewrites <a href> tags at build time;
# these redirects catch direct navigation / bookmarks / typed URLs.
# ============================================================

[[redirects]]
  from = "/*/index.html"
  to = "/:splat/"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301
  force = true

# ============================================================
# BUCKET 4 HARDENING — D-S337-EXT7-VAULT (2026-07-19)
# Kill deploy previews + branch deploys. Only production serves.
# Deploy previews bypass the 2FA gate and would leak the portal
# to anyone with a preview URL. Same for branch deploys.
# ============================================================

[context.deploy-preview]
  command = "echo 'Deploy previews DISABLED — Bucket 4 hardening' && exit 1"

[context.branch-deploy]
  command = "echo 'Branch deploys DISABLED — Bucket 4 hardening' && exit 1"

# ============================================================
# SECURITY HEADERS — reinforce gate discipline
# ============================================================

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

[[headers]]
  for = "/case/vault/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, private"
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, notranslate"
